name: Build Multi-Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

jobs:
  build-multi-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86 (64-bit)
          - platform: windows-latest
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            name: Windows x64
          
          # macOS Intel (x86)
          - platform: macos-latest
            os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
            name: macOS Intel
          
          # macOS Apple Silicon (ARM)
          - platform: macos-latest
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            name: macOS Apple Silicon

    runs-on: ${{ matrix.os }}
    
    env:
      DEBUG: "true"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
      
    - name: Setup Python (Windows only)
      if: matrix.platform == 'windows-latest'
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "./src-tauri -> target"
        key: ${{ matrix.target }}
                
    - name: Install frontend dependencies
      run: pnpm install
      
    - name: Build frontend
      run: pnpm build
      
    - name: Install system dependencies (macOS)
      if: matrix.platform == 'macos-latest'
      run: |
        # 安装可能需要的系统依赖
        echo "Setting up macOS dependencies..."
        
    - name: Build Tauri app
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        args: --target ${{ matrix.target }}
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: testx-${{ matrix.arch }}-${{ matrix.platform }}
        path: |
          src-tauri/target/${{ matrix.target }}/release/bundle/**/*
        retention-days: 30
        
    - name: List build artifacts (Debug)
      if: env.DEBUG == 'true'
      shell: bash
      run: |
        echo "=== Build artifacts for ${{ matrix.name }} ==="
        find src-tauri/target/${{ matrix.target }}/release/bundle -type f -name "*" 2>/dev/null || echo "No bundle directory found"
        echo "=== Target directory structure ==="
        ls -la src-tauri/target/${{ matrix.target }}/release/ 2>/dev/null || echo "No release directory found"

  # 可选：创建一个汇总job来收集所有构建结果
  collect-artifacts:
    needs: build-multi-platform
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: List all artifacts
      run: |
        echo "=== All build artifacts ==="
        find artifacts -type f -name "*" | sort
        
    - name: Create build summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Platforms Built:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Windows x64" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ macOS Intel (x86)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ macOS Apple Silicon (ARM)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Artifacts:" >> $GITHUB_STEP_SUMMARY
        find artifacts -name "*.exe" -o -name "*.dmg" -o -name "*.app" -o -name "*.msi" | while read file; do
          echo "- 📦 $(basename "$file")" >> $GITHUB_STEP_SUMMARY
        done