[package]
name = "tencentcloud-speech-rust-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Tencent Cloud Speech SDK for Rust"
license = "MIT"

[dependencies]
reqwest = { version = "0.11", features = ["json", "multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
hmac = "0.12"
sha1 = "0.10"
thiserror = "1.0"
url = "2.4"
bytes = "1.0"
async-trait = "0.1"
log = "0.4"
